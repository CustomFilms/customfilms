<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Custom Films</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

/* HEADER (UNCHANGED) */

header{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding:40px 0;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    width:350px;
    max-width:70%;
}

nav{
    display:flex;
    gap:40px;
}

nav a{
    color:white;
    text-decoration:none;
    letter-spacing:3px;
    font-size:13px;
    transition:.3s;
}

nav a:hover{
    opacity:.6;
}

/* GRID */

.grid{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding-bottom:80px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
    gap:22px;
}

/* CARD */

.video{
    position:relative;
    overflow:hidden;
    cursor:pointer;
    background:#111;
    aspect-ratio:16/9;
}

/* IMAGE */

.video img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:opacity .3s ease;
}

/* IFRAME (hidden until hover) */

.video iframe{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
}

/* SHOW VIDEO ON HOVER */

.video:hover iframe{
    opacity:1;
}

.video:hover img{
    opacity:0;
}

/* OVERLAY */

.overlay{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.35);

    opacity:0;
    transition:.25s;

    font-size:14px;
    letter-spacing:2px;
    text-align:center;
}

.video:hover .overlay{
    opacity:1;
}

/* MOBILE */

@media(max-width:768px){

    header{
        flex-direction:column;
        gap:25px;
    }

    .logo{
        width:280px;
    }

    nav{
        gap:25px;
    }

}

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <img src="logo.png" class="logo" alt="Custom Films">

    <nav>
        <a href="index.html">FILMS</a>
        <a href="about.html">ABOUT</a>
    </nav>

</header>

<div id="grid" class="grid"></div>

<script>

const films = [
    {id:"875134288", title:"SHOWREEL"},
    {id:"1050757865", title:"REICHLE & DE-MASSARI"},
    {id:"875132136", title:"ICELAND"},
    {id:"482721100", title:"MERCEDES"},
    {id:"476001858", title:"TILABRAS FISH FARM"},
    {id:"875542319", title:"MYGYM"},
    {id:"637911167", title:"NORTH TENERIFE"},
    {id:"644845266", title:"WEBSTAGE MASTERS"},
    {id:"287788355", title:"PRODUCT FILM"},
    {id:"800771439", title:"KOH SAMUI"},
    {id:"652153530", title:"SIGNODE"},
    {id:"829526792", title:"MYGYM PROMO"},
    {id:"348184376", title:"GREEN EIGHT CAPITAL"},
    {id:"345945132", title:"PAVILLON LE CORBUSIER"}
];

const grid = document.getElementById("grid");

function createCard(film){

    const card = document.createElement("div");
    card.className = "video";
    card.dataset.id = film.id;

    card.innerHTML = `
        <img alt="${film.title}">
        <iframe
            src="https://player.vimeo.com/video/${film.id}?muted=1&autoplay=0&loop=1&background=1"
            allow="autoplay; fullscreen"
        ></iframe>
        <div class="overlay">${film.title}</div>
    `;

    /* LOAD THUMBNAIL (FIXED OEMBED) */

    fetch(`https://vimeo.com/api/oembed.json?url=https://vimeo.com/${film.id}`)
        .then(r => r.json())
        .then(data => {

            let thumb = data.thumbnail_url;

            // FIX Vimeo low-res palette issue
            thumb = thumb.replace("_200x150", "_640");

            card.querySelector("img").src = thumb;

        });

    grid.appendChild(card);

}

films.forEach(createCard);

/* HOVER PLAY CONTROL */

document.addEventListener("mouseover", (e) => {

    const card = e.target.closest(".video");
    if(!card) return;

    const iframe = card.querySelector("iframe");
    iframe.contentWindow.postMessage(
        '{"method":"play"}',
        "*"
    );

});

document.addEventListener("mouseout", (e) => {

    const card = e.target.closest(".video");
    if(!card) return;

    const iframe = card.querySelector("iframe");
    iframe.contentWindow.postMessage(
        '{"method":"pause"}',
        "*"
    );

});

</script>

</body>
</html>
