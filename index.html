<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Custom Films</title>

<meta name="description" content="Custom Films — independent filmmaking and creative production based in Zürich, Switzerland.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:#000;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
    position:relative;
}

/* BACKGROUND DOTS */

body::before{
    content:"";
    position:fixed;
    inset:0;

    pointer-events:none;
    z-index:0;

    opacity:.22;

    background-image:radial-gradient(
        rgba(255,255,255,.65) .7px,
        transparent .8px
    );

    background-size:22px 22px;
}

/* HEADER */

header{
    position:relative;
    z-index:10;

    width:92%;
    max-width:1800px;
    height:145px;
    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:25px;
}

.logo{
    display:block;

    width:320px;
    max-width:80%;

    height:auto;
}

nav{
    display:flex;
    gap:40px;
}

nav a{
    color:#fff;
    text-decoration:none;

    letter-spacing:3px;
    font-size:13px;

    opacity:.65;

    transition:opacity .25s ease;
}

nav a:hover,
nav a.active{
    opacity:1;
}

/* CLAIM */

.claim{
    position:relative;
    z-index:1;

    width:92%;
    max-width:1800px;
    margin:auto;

    padding:30px 0 65px;

    font-size:clamp(14px,1.4vw,22px);

    letter-spacing:7px;
    text-transform:uppercase;

    opacity:.45;
}

/* GRID */

.grid{
    position:relative;
    z-index:1;

    width:92%;
    max-width:1800px;
    margin:auto;

    padding-bottom:80px;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(380px,1fr));

    gap:25px;
}

/* CARD */

.card{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.video{
    position:relative;

    aspect-ratio:16/9;

    overflow:hidden;

    cursor:pointer;

    background:#111;
}

.video img{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:1;

    transition:opacity .35s ease;
}

.video iframe{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border:none;

    opacity:0;

    pointer-events:none;

    transition:opacity .35s ease;
}

.video.previewing iframe{
    opacity:1;
}

.video.previewing img{
    opacity:0;
}

/* TITLE */

.title{
    font-size:13px;
    letter-spacing:2px;
    opacity:.85;
}

/* FOOTER */

footer{
    position:relative;
    z-index:1;

    width:92%;
    max-width:1800px;
    margin:auto;

    border-top:1px solid #222;

    padding:30px 0 50px;

    display:flex;
    justify-content:space-between;

    font-size:10px;
    letter-spacing:2px;

    opacity:.4;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.92);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:9999;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:80%;
    max-width:1200px;

    aspect-ratio:16/9;
}

.modal-content iframe{
    width:100%;
    height:100%;

    border:none;
}

.close{
    position:absolute;

    top:20px;
    right:30px;

    font-size:30px;
    line-height:1;

    cursor:pointer;

    color:white;
    opacity:.7;

    transition:opacity .2s ease;
}

.close:hover{
    opacity:1;
}

/* MOBILE */

@media(max-width:768px){

    header{
        height:125px;
        gap:20px;
    }

    .logo{
        width:260px;
    }

    nav{
        gap:25px;
    }

    nav a{
        font-size:11px;
    }

    .claim{
        padding:20px 0 45px;

        font-size:11px;
        letter-spacing:4px;

        line-height:1.8;
    }

    .grid{
        grid-template-columns:1fr;
        gap:28px;
    }

    footer{
        flex-direction:column;
        gap:15px;
    }

    .modal-content{
        width:95%;
    }

}

</style>

</head>

<body>

<header>

```
<a href="./index.html">

    <img
        src="logo.png"
        class="logo"
        alt="Custom Films">

</a>


<nav>

    <a
        href="./index.html"
        class="active">
        FILMS
    </a>

    <a
        href="./about.html">
        ABOUT
    </a>

</nav>
```

</header>

<div class="claim">
    FILMS, STORIES, PEOPLE
</div>

<div
    id="grid"
    class="grid">
</div>

<footer>

```
<span>
    © CUSTOM FILMS
</span>

<span>
    ZÜRICH / SWITZERLAND
</span>
```

</footer>

<!-- MODAL -->

<div
    id="modal"
    class="modal">

```
<div
    class="close"
    id="close">
    ×
</div>

<div class="modal-content">

    <iframe
        id="modalFrame"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

</div>
```

</div>

<script>

const films = [

    "875134288",
    "1050757865",
    "875132136",
    "482721100",
    "476001858",
    "875542319",
    "637911167",
    "644845266",
    "287788355",
    "800771439",
    "652153530",
    "829526792",
    "348184376",
    "345945132"

];


const grid =
    document.getElementById("grid");

const modal =
    document.getElementById("modal");

const modalFrame =
    document.getElementById("modalFrame");

const closeBtn =
    document.getElementById("close");


function createCard(id){

    const card =
        document.createElement("div");

    card.className =
        "card";


    const video =
        document.createElement("div");

    video.className =
        "video";


    const image =
        document.createElement("img");

    image.alt =
        "Custom Films video";

    image.loading =
        "lazy";

    image.decoding =
        "async";


    const title =
        document.createElement("div");

    title.className =
        "title";

    title.innerText =
        "Loading...";


    video.appendChild(image);

    card.appendChild(video);

    card.appendChild(title);

    grid.appendChild(card);


    let iframe = null;
    let loaded = false;


    /* THUMBNAIL + TITLE */

    fetch(
        `https://vimeo.com/api/oembed.json?url=https://vimeo.com/${id}`
    )

    .then(response =>
        response.json()
    )

    .then(data => {

        title.innerText =
            data.title || "Film";


        if(data.thumbnail_url){

            image.src =
                data.thumbnail_url
                .replace(
                    "_200x150",
                    "_1280"
                );

        }

    })

    .catch(() => {

        title.innerText =
            "Film";

    });


    /* VIMEO PLAYER */

    function loadPreview(){

        if(loaded)
            return;

        loaded = true;


        iframe =
            document.createElement("iframe");


        iframe.src =
            `https://player.vimeo.com/video/${id}?` +
            `muted=1&background=1&autoplay=1&loop=1&` +
            `title=0&byline=0&portrait=0`;


        iframe.allow =
            "autoplay; fullscreen";

        iframe.loading =
            "lazy";


        video.appendChild(iframe);


        iframe.onload = () => {

            video.classList.add(
                "previewing"
            );

        };

    }


    /* HOVER */

    video.addEventListener(
        "mouseenter",
        () => {

            if(
                window.matchMedia(
                    "(hover:hover)"
                ).matches
            ){

                loadPreview();

                video.classList.add(
                    "previewing"
                );

            }

        }
    );


    video.addEventListener(
        "mouseleave",
        () => {

            if(iframe){

                iframe.contentWindow.postMessage(

                    JSON.stringify({
                        method:"pause"
                    }),

                    "*"

                );

                video.classList.remove(
                    "previewing"
                );

            }

        }
    );


    /* OPEN FILM */

    video.addEventListener(
        "click",
        () => {

            modal.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";


            modalFrame.src =
                `https://player.vimeo.com/video/${id}?` +
                `autoplay=1&muted=0&title=0&` +
                `byline=0&portrait=0`;

        }
    );

}


function closeModal(){

    modal.classList.remove(
        "active"
    );

    modalFrame.src =
        "";

    document.body.style.overflow =
        "";

}


closeBtn.addEventListener(
    "click",
    closeModal
);


modal.addEventListener(
    "click",
    event => {

        if(
            event.target === modal
        ){

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);


films.forEach(
    createCard
);

</script>

</body>

</html>
