<title>Custom Films</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

/* HEADER */

header{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding:50px 0 20px;
    text-align:center;
}

.logo{
    width:320px;
    max-width:90%;
}

nav{
    margin-top:25px;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin:0 20px;
    letter-spacing:3px;
    font-size:13px;
}

nav a:hover{
    opacity:.6;
}

/* GRID */

.grid{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding:40px 0 80px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:22px;
}

/* VIDEO CARD */

.video{
    position:relative;
    cursor:pointer;
    overflow:hidden;
    background:#111;
}

.video img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
    transition:transform .35s ease;
}

.video:hover img{
    transform:scale(1.03);
}

/* OVERLAY */

.overlay{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    padding:20px;

    background:rgba(0,0,0,.65);

    opacity:0;
    transition:.25s;

    font-size:14px;
    letter-spacing:2px;
}

.video:hover .overlay{
    opacity:1;
}

/* PLAYER INSIDE GRID ITEM */

.video.playing{
    background:#000;
}

.video.playing img{
    display:none;
}

.video iframe{
    width:100%;
    aspect-ratio:16/9;
    border:none;
}

/* FOOTER */

footer{
    text-align:center;
    padding:50px;
    font-size:12px;
    color:#666;
}

</style>

</head>

<body>
