<!DOCTYPE html>

<title>Custom Films</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Arial, Helvetica, sans-serif;
}

header{
padding:50px 20px 30px;
text-align:center;
}

.logo{
width:500px;
max-width:90%;
}

nav{
margin-top:30px;
}

nav a{
color:white;
text-decoration:none;
margin:0 25px;
letter-spacing:3px;
font-size:13px;
}

nav a:hover{
opacity:.6;
}

.grid{
width:92%;
max-width:1800px;
margin:auto;
padding-bottom:80px;

display:grid;
grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
gap:25px;
}

.video{
position:relative;
overflow:hidden;
}

.video iframe{
width:100%;
aspect-ratio:16/9;
border:none;
}

.overlay{
position:absolute;
bottom:0;
left:0;
right:0;
padding:20px;

background:linear-gradient(
transparent,
rgba(0,0,0,.9)
);

font-size:14px;
letter-spacing:2px;
opacity:0;
transition:.3s;
pointer-events:none;
}

.video:hover .overlay{
opacity:1;
}

footer{
text-align:center;
padding:50px;
font-size:12px;
color:#777;
}

@media(max-width:600px){
.grid{
grid-template-columns:1fr;
}
}

</style>

</head>
