<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Films</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:.22;
    background-image:radial-gradient(
        rgba(255,255,255,.65) .7px,
        transparent .8px
    );
    background-size:22px 22px;
}

header{
    position:relative;
    z-index:10;
    width:92%;
    max-width:1800px;
    height:145px;
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.logo{
    display:block;
    width:320px;
    max-width:80%;
    height:auto;
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
}

nav{
    display:flex;
    gap:40px;
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:12px;
    letter-spacing:3px;
    transition:opacity .3s ease;
}

nav a:hover{
    opacity:.5;
}

.claim{
    position:relative;
    z-index:1;
    width:92%;
    max-width:1800px;
    margin:70px auto 45px;
    font-size:11px;
    letter-spacing:4px;
    opacity:.45;
}

.grid{
    position:relative;
    z-index:1;
    width:92%;
    max-width:1800px;
    margin:0 auto 100px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
    gap:25px;
}

.card{
    position:relative;
    aspect-ratio:16/9;
    overflow:hidden;
    background:#111;
    cursor:pointer;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .7s ease,opacity .5s ease;
}

.card:hover img{
    transform:scale(1.03);
    opacity:.65;
}

.card iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    pointer-events:none;
}

footer{
    position:relative;
    z-index:1;
    width:92%;
    max-width:1800px;
    margin:auto;
    border-top:1px solid #222;
    padding:30px 0 50px;
    display:flex;
    justify-content:space-between;
    font-size:10px;
    letter-spacing:2px;
    opacity:.4;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.94);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:min(1400px,92vw);
    aspect-ratio:16/9;
    position:relative;
}

.modal iframe{
    width:100%;
    height:100%;
    border:0;
}

.close{
    position:absolute;
    top:-45px;
    right:0;
    color:#fff;
    font-size:22px;
    cursor:pointer;
    font-weight:300;
}

@media(max-width:700px){

    header{
        height:125px;
        gap:20px;
    }

    .logo{
        width:260px;
        top:28px;
    }

    nav{
        gap:25px;
        bottom:0;
    }

    nav a{
        font-size:11px;
    }

    .claim{
        margin:50px auto 30px;
        font-size:9px;
        letter-spacing:3px;
    }

    .grid{
        width:92%;
        grid-template-columns:1fr;
        gap:15px;
        margin-bottom:70px;
    }

    footer{
        padding:25px 0 35px;
        font-size:8px;
        letter-spacing:1.5px;
    }

    .modal{
        padding:15px;
    }

    .close{
        top:-35px;
    }
}
</style>
</head>

<body>

<header>

    <a href="index.html">
        <img src="logo.png" class="logo" alt="Custom Films">
    </a>

    <nav>
        <a href="index.html">FILMS</a>
        <a href="about.html">ABOUT</a>
    </nav>

</header>

<div class="claim">
    FILMS, STORIES, PEOPLE
</div>

<main class="grid" id="filmGrid"></main>

<footer>
    <span>© CUSTOM FILMS</span>
    <span>ZÜRICH / SWITZERLAND</span>
</footer>

<div class="modal" id="modal">
    <div class="modal-content">
        <div class="close" id="close">×</div>
        <iframe
            id="modalFrame"
            src=""
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>
</div>

<script>

const films = [
    "875134288",
    "1198727288",
    "1068371126",
    "1068370967",
    "1068370885",
    "1068370812",
    "1068370745",
    "1068370675",
    "1068370595",
    "1068370524",
    "1068370452",
    "1068370378",
    "1068370302",
    "1068370228",
    "1198727288"
];

const grid = document.getElementById("filmGrid");
const modal = document.getElementById("modal");
const modalFrame = document.getElementById("modalFrame");
const close = document.getElementById("close");

films.forEach(id => {

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "Custom Films";
    img.src = `https://vumbnail.com/${id}.jpg`;

    card.appendChild(img);

    let iframe = null;

    card.addEventListener("mouseenter", () => {

        if(!iframe){

            iframe = document.createElement("iframe");

            iframe.src =
                `https://player.vimeo.com/video/${id}?background=1&autoplay=1&muted=1&loop=1&title=0&byline=0&portrait=0`;

            iframe.allow = "autoplay; fullscreen";
            iframe.setAttribute("frameborder","0");

            card.appendChild(iframe);
        }
    });

    card.addEventListener("mouseleave", () => {

        if(iframe){
            iframe.remove();
            iframe = null;
        }
    });

    card.addEventListener("click", () => {

        modal.classList.add("active");

        modalFrame.src =
            `https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0`;
    });

    grid.appendChild(card);
});

function closeModal(){

    modal.classList.remove("active");
    modalFrame.src = "";
}

close.addEventListener("click", closeModal);

modal.addEventListener("click", e => {

    if(e.target === modal){
        closeModal();
    }
});

document.addEventListener("keydown", e => {

    if(e.key === "Escape"){
        closeModal();
    }
});

</script>

</body>
</html>
