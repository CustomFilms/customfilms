<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Custom Films</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

/* HEADER */

header{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding:40px 0;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    width:350px;
    max-width:70%;
}

nav{
    display:flex;
    gap:40px;
}

nav a{
    color:white;
    text-decoration:none;
    letter-spacing:3px;
    font-size:13px;
    transition:.3s;
}

nav a:hover{
    opacity:.6;
}

/* PLAYER */

#player-container{
    width:92%;
    max-width:1800px;
    margin:0 auto 30px;
}

#mainPlayer{
    width:100%;
    aspect-ratio:16/9;
    border:none;
}

/* GRID */

.grid{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding-bottom:80px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:25px;
}

.video{
    position:relative;
    overflow:hidden;
    cursor:pointer;
    background:#111;
}

.video img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
    transition:transform .4s ease;
}

.video:hover img{
    transform:scale(1.03);
}

.overlay{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:30px;

    background:rgba(0,0,0,.75);

    opacity:0;
    transition:.3s;

    font-size:14px;
    letter-spacing:2px;
    line-height:1.6;
}

.video:hover .overlay{
    opacity:1;
}

/* FOOTER */

footer{
    text-align:center;
    padding:50px;
    font-size:12px;
    color:#777;
}

@media(max-width:768px){

    header{
        flex-direction:column;
        gap:25px;
    }

    .logo{
        width:280px;
    }

    nav{
        gap:25px;
    }

}

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

<script>

const player = document.getElementById('mainPlayer');

document.querySelectorAll('.video').forEach(video => {

    video.addEventListener('click', () => {

        const id = video.dataset.video;

        player.src =
            `https://player.vimeo.com/video/${id}?autoplay=1`;

        window.scrollTo({
            top: player.offsetTop - 40,
            behavior: 'smooth'
        });

    });

});

</script>
