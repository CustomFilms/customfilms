<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Custom Films</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

/* HEADER (UNCHANGED) */

header{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding:40px 0;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    width:350px;
    max-width:70%;
}

nav{
    display:flex;
    gap:40px;
}

nav a{
    color:white;
    text-decoration:none;
    letter-spacing:3px;
    font-size:13px;
    transition:.3s;
}

nav a:hover{
    opacity:.6;
}

/* GRID */

.grid{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding-bottom:80px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
    gap:25px;
}

/* CARD */

.card{
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* VIDEO */

.video{
    position:relative;
    aspect-ratio:16/9;
    overflow:hidden;
    cursor:pointer;
    background:#111;
}

.video img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:opacity .3s ease;
}

.video iframe{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
}

/* TITLE */

.title{
    font-size:13px;
    letter-spacing:2px;
    opacity:.85;
}

/* HOVER PLAY */

.card:hover iframe{
    opacity:1;
}

.card:hover img{
    opacity:0;
}

/* MOBILE */

@media(max-width:768px){

    header{
        flex-direction:column;
        gap:25px;
    }

    .logo{
        width:280px;
    }

    nav{
        gap:25px;
    }

}

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <img src="logo.png" class="logo" alt="Custom Films">

    <nav>
        <a href="index.html">FILMS</a>
        <a href="about.html">ABOUT</a>
    </nav>

</header>

<div id="grid" class="grid"></div>

<script>

const films = [
    "875134288",
    "1050757865",
    "875132136",
    "482721100",
    "476001858",
    "875542319",
    "637911167",
    "644845266",
    "287788355",
    "800771439",
    "652153530",
    "829526792",
    "348184376",
    "345945132"
];

const grid = document.getElementById("grid");

function createCard(id){

    const card = document.createElement("div");
    card.className = "card";

    const video = document.createElement("div");
    video.className = "video";

    video.innerHTML = `
        <img alt="">
        <iframe
            src="https://player.vimeo.com/video/${id}?muted=1&autoplay=0&loop=1&background=1"
            allow="autoplay; fullscreen"
        ></iframe>
    `;

    const title = document.createElement("div");
    title.className = "title";
    title.innerText = "Loading...";

    card.appendChild(video);
    card.appendChild(title);

    grid.appendChild(card);

    const iframe = video.querySelector("iframe");

    /* VIMEO OEMBED (THUMB + TITLE AUTO) */
    fetch(`https://vimeo.com/api/oembed.json?url=https://vimeo.com/${id}`)
        .then(r => r.json())
        .then(data => {

            // TITLE from Vimeo
            title.innerText = data.title;

            // THUMB FIX
            let thumb = data.thumbnail_url;
            thumb = thumb.replace("_200x150", "_640");

            video.querySelector("img").src = thumb;

        })
        .catch(() => {
            title.innerText = "Untitled";
        });

    /* HOVER PLAY (MUTED) */
    video.addEventListener("mouseenter", () => {

        iframe.contentWindow.postMessage(
            '{"method":"play"}',
            "*"
        );

    });

    /* LEAVE STOP + RESET */
    video.addEventListener("mouseleave", () => {

        iframe.contentWindow.postMessage(
            '{"method":"pause"}',
            "*"
        );

        iframe.contentWindow.postMessage(
            '{"method":"setCurrentTime","value":0}',
            "*"
        );

    });

    /* CLICK → SOUND ON + START */
    video.addEventListener("click", () => {

        iframe.src =
            `https://player.vimeo.com/video/${id}?autoplay=1&muted=0&background=0`;

    });

}

films.forEach(createCard);

</script>

</body>
</html>
