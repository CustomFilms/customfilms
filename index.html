<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Custom Films</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

/* HEADER */

header{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding:40px 0;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:25px;
}

.logo{
    width:320px;
    max-width:80%;
}

nav{
    display:flex;
    gap:40px;
}

nav a{
    color:white;
    text-decoration:none;
    letter-spacing:3px;
    font-size:13px;
}

/* GRID */

.grid{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding-bottom:80px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
    gap:25px;
}

/* CARD */

.card{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.video{
    position:relative;
    aspect-ratio:16/9;
    overflow:hidden;
    cursor:pointer;
    background:#111;
}

.video img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

.video iframe{
    position:absolute;
    width:100%;
    height:100%;
    border:none;

    opacity:0;
    pointer-events:none;
}

/* HOVER PREVIEW */

.card:hover iframe{
    opacity:1;
}

.card:hover img{
    opacity:0;
}

/* TITLE */

.title{
    font-size:13px;
    letter-spacing:2px;
    opacity:.85;
}

/* FOOTER */

footer{
    text-align:center;
    padding:50px;
    font-size:12px;
    color:#777;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:80%;
    max-width:1000px;
    aspect-ratio:16/9;
}

.modal-content iframe{
    width:100%;
    height:100%;
    border:none;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
    color:white;
}

/* MOBILE */

@media(max-width:768px){
    header{gap:20px;}
    .logo{width:260px;}
    nav{gap:25px;}
    .modal-content{width:95%;}
}

</style>

</head>

<body>

<header>

    <img src="logo.png" class="logo" alt="Custom Films">

    <nav>
    <a href="./index.html">FILMS</a>
    <a href="./about.html">ABOUT</a>
</nav>

</header>

<div id="grid" class="grid"></div>

<footer>© Custom Films</footer>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="close" id="close">×</div>
    <div class="modal-content">
        <iframe id="modalFrame" allow="autoplay; fullscreen"></iframe>
    </div>
</div>

<script>

const films = [
    "875134288",
    "1050757865",
    "875132136",
    "482721100",
    "476001858",
    "875542319",
    "637911167",
    "644845266",
    "287788355",
    "800771439",
    "652153530",
    "829526792",
    "348184376",
    "345945132"
];

const grid = document.getElementById("grid");

const modal = document.getElementById("modal");
const modalFrame = document.getElementById("modalFrame");
const closeBtn = document.getElementById("close");

function createCard(id){

    const card = document.createElement("div");
    card.className = "card";

    const video = document.createElement("div");
    video.className = "video";

    video.innerHTML = `
        <img alt="">
        <iframe
            src="https://player.vimeo.com/video/${id}?muted=1&background=1&autoplay=0&loop=1"
            allow="autoplay; fullscreen"
        ></iframe>
    `;

    const title = document.createElement("div");
    title.className = "title";
    title.innerText = "Loading...";

    card.appendChild(video);
    card.appendChild(title);
    grid.appendChild(card);

    const iframe = video.querySelector("iframe");

    /* TITLE + THUMB */
    fetch(`https://vimeo.com/api/oembed.json?url=https://vimeo.com/${id}`)
        .then(r => r.json())
        .then(data => {

            title.innerText = data.title;
            video.querySelector("img").src =
                data.thumbnail_url.replace("_200x150","_640");

        });

    /* HOVER PLAY */
    video.addEventListener("mouseenter", () => {
        iframe.contentWindow.postMessage('{"method":"play"}', "*");
    });

    video.addEventListener("mouseleave", () => {
        iframe.contentWindow.postMessage('{"method":"pause"}', "*");
    });

    /* CLICK → OPEN MODAL */
    video.addEventListener("click", () => {

        modal.classList.add("active");

        modalFrame.src =
            `https://player.vimeo.com/video/${id}?autoplay=1&muted=0&title=0&byline=0&portrait=0`;

    });

}

/* CLOSE MODAL */

closeBtn.addEventListener("click", () => {
    modal.classList.remove("active");
    modalFrame.src = "";
});

modal.addEventListener("click", (e) => {
    if(e.target === modal){
        modal.classList.remove("active");
        modalFrame.src = "";
    }
});

films.forEach(createCard);

</script>

</body>
</html>
