<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About - Custom Films</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

/* HEADER bleibt gleich */
header{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding:40px 0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:25px;
    position:relative;
    z-index:10;
}

.logo{
    width:320px;
    max-width:80%;
}

nav{
    display:flex;
    gap:40px;
}

nav a{
    color:white;
    text-decoration:none;
    letter-spacing:3px;
    font-size:13px;
    opacity:.85;
}

/* HERO bleibt gleich */
.hero{
    width:100%;
    height:70vh;
    position:relative;
    overflow:hidden;
    margin-bottom:80px;
}

.hero iframe{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    border:none;
    transform:scale(1.1);
}

/* ABOUT SECTION (neu) */
.about{
    width:92%;
    max-width:1100px;
    margin:auto;
    padding:0 0 120px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

/* INFO LINKS */
.info{
    font-size:18px;
    line-height:1.8;
    letter-spacing:1px;
}

.info h1{
    font-size:34px;
    letter-spacing:3px;
    margin-bottom:15px;
}

.info h2{
    font-size:16px;
    font-weight:normal;
    opacity:.7;
    margin-bottom:30px;
}

.contact{
    font-size:18px;
    line-height:2;
    opacity:.9;
}

/* VIDEO RECHTS */
.about iframe{
    width:100%;
    height:420px;
    border:none;
}

/* MOBILE */
@media(max-width:768px){
    .about{
        grid-template-columns:1fr;
    }

    .about iframe{
        height:300px;
    }
}

</style>

</head>

<body>

<header>
    <img src="logo.png" class="logo" alt="Custom Films">

    <nav>
        <a href="./index.html">FILMS</a>
        <a href="./about.html">ABOUT</a>
    </nav>
</header>

<!-- HERO bleibt -->
<section class="hero">
    <iframe 
        src="https://player.vimeo.com/video/1198727288?background=1&autoplay=1&loop=1&muted=1"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</section>

<!-- ABOUT NEU -->
<section class="about">

    <!-- LINKS: INFO -->
    <div class="info">

        <h1>Marco Sahli</h1>
        <h2>Filmmaker / Creative Producer</h2>

        <div class="contact">
            Florastrasse 18<br>
            8008 Zürich<br><br>
            Email: info@customfilms.ch<br>
            Phone: +41 76 342 23 07
        </div>

    </div>

    <!-- RECHTS: VIDEO -->
    <iframe 
        src="https://player.vimeo.com/video/1198727288?background=1&autoplay=1&loop=1&muted=1"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

</section>

<footer>© Custom Films</footer>

</body>
</html>
