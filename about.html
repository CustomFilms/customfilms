<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Custom Films</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:.22;
    background-image:radial-gradient(
        rgba(255,255,255,.65) .7px,
        transparent .8px
    );
    background-size:22px 22px;
}

header{
    position:relative;
    z-index:10;
    width:92%;
    max-width:1800px;
    height:145px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:25px;
}

.logo{
    display:block;
    width:320px;
    max-width:80%;
    height:auto;
    position:absolute;
    left:50%;
    top:40px;
    transform:translateX(-50%);
}

nav{
    display:flex;
    gap:40px;
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:12px;
    letter-spacing:3px;
    transition:opacity .3s ease;
}

nav a:hover{
    opacity:.5;
}

.about-intro{
    position:relative;
    z-index:1;
    width:92%;
    max-width:1800px;
    margin:120px auto 100px;
}

.about-intro .location{
    font-size:10px;
    letter-spacing:4px;
    opacity:.4;
    margin-bottom:35px;
}

.about-intro h1{
    font-size:clamp(55px,10vw,170px);
    line-height:.82;
    font-weight:400;
    letter-spacing:-7px;
    max-width:1300px;
}

.about-intro h1 span{
    display:block;
}

.statement{
    position:relative;
    z-index:1;
    width:92%;
    max-width:1000px;
    margin:0 auto 120px;
    font-size:clamp(24px,3vw,45px);
    line-height:1.15;
    font-weight:300;
}

.video{
    position:relative;
    z-index:1;
    width:92%;
    max-width:1800px;
    margin:0 auto 120px;
    aspect-ratio:16/9;
    background:#111;
}

.video iframe{
    width:100%;
    height:100%;
    border:0;
}

.person{
    position:relative;
    z-index:1;
    width:92%;
    max-width:1800px;
    margin:0 auto 120px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
}

.person-name{
    font-size:clamp(35px,5vw,75px);
    line-height:1;
    font-weight:400;
    letter-spacing:-3px;
}

.person-role{
    margin-top:15px;
    font-size:10px;
    letter-spacing:3px;
    opacity:.45;
}

.contact{
    font-size:12px;
    line-height:2;
    letter-spacing:1px;
}

.contact a{
    color:#fff;
    text-decoration:none;
}

.contact a:hover{
    opacity:.5;
}

footer{
    position:relative;
    z-index:1;
    width:92%;
    max-width:1800px;
    margin:auto;
    border-top:1px solid #222;
    padding:30px 0 50px;
    display:flex;
    justify-content:space-between;
    font-size:10px;
    letter-spacing:2px;
    opacity:.4;
}

@media(max-width:700px){

    header{
        height:125px;
        gap:20px;
    }

    .logo{
        width:260px;
        top:28px;
    }

    nav{
        gap:25px;
        bottom:0;
    }

    nav a{
        font-size:11px;
    }

    .about-intro{
        margin:80px auto 70px;
    }

    .about-intro .location{
        font-size:8px;
        letter-spacing:3px;
        margin-bottom:25px;
    }

    .about-intro h1{
        font-size:clamp(50px,17vw,100px);
        letter-spacing:-4px;
    }

    .statement{
        margin-bottom:80px;
        font-size:25px;
    }

    .video{
        width:92%;
        margin-bottom:80px;
    }

    .person{
        grid-template-columns:1fr;
        gap:50px;
        margin-bottom:80px;
    }

    .person-name{
        font-size:48px;
    }

    footer{
        padding:25px 0 35px;
        font-size:8px;
        letter-spacing:1.5px;
    }
}
</style>
</head>

<body>

<header>

    <a href="index.html">
        <img src="logo.png" class="logo" alt="Custom Films">
    </a>

    <nav>
        <a href="index.html">FILMS</a>
        <a href="about.html">ABOUT</a>
    </nav>

</header>

<section class="about-intro">

    <div class="location">
        CUSTOM FILMS — ZÜRICH
    </div>

    <h1>
        <span>FILMS,</span>
        <span>STORIES,</span>
        <span>PEOPLE.</span>
    </h1>

</section>

<section class="statement">

    We create films with people, brands and ideas worth remembering.

</section>

<section class="video">

    <iframe
        src="https://player.vimeo.com/video/875134288?title=0&byline=0&portrait=0"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
    </iframe>

</section>

<section class="person">

    <div>
        <div class="person-name">
            Marco Sahli
        </div>

        <div class="person-role">
            DIRECTOR / FILMMAKER
        </div>
    </div>

    <div class="contact">

        <div>
            ZÜRICH, SWITZERLAND
        </div>

        <div>
            <a href="mailto:hello@customfilms.ch">
                hello@customfilms.ch
            </a>
        </div>

    </div>

</section>

<footer>

    <span>© CUSTOM FILMS</span>
    <span>ZÜRICH / SWITZERLAND</span>

</footer>

</body>
</html>
