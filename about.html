<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About - Custom Films</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

/* HEADER */

header{
    width:92%;
    max-width:1800px;
    margin:auto;
    padding:40px 0;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:25px;
}

.logo{
    width:320px;
    max-width:80%;
}

nav{
    display:flex;
    gap:40px;
}

nav a{
    color:white;
    text-decoration:none;
    letter-spacing:3px;
    font-size:13px;
    opacity:.85;
    transition:0.3s;
}

nav a:hover{
    opacity:1;
}

/* ABOUT SECTION */

.about{
    width:92%;
    max-width:1200px;
    margin:60px auto 0;
    padding:0 0 120px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:center;
}

/* INFO LINKS */

.info h1{
    font-size:42px;
    letter-spacing:3px;
    margin-bottom:15px;
}

.info h2{
    font-size:18px;
    font-weight:normal;
    opacity:.7;
    margin-bottom:40px;
    letter-spacing:2px;
}

.contact{
    font-size:22px;
    line-height:2;
    opacity:.9;
}

/* VIDEO RECHTS */

.about iframe{
    width:100%;
    height:500px;
    border:none;
}

/* FOOTER */

footer{
    text-align:center;
    padding:60px;
    font-size:12px;
    color:#777;
}

/* MOBILE */

@media(max-width:768px){

    .about{
        grid-template-columns:1fr;
        gap:40px;
        margin-top:30px;
    }

    .about iframe{
        height:300px;
    }

    .info h1{
        font-size:32px;
    }

    .contact{
        font-size:18px;
    }
}

</style>

</head>

<body>

<header>

    <img src="logo.png" class="logo" alt="Custom Films">

    <nav>
        <a href="./index.html">FILMS</a>
        <a href="./about.html">ABOUT</a>
    </nav>

</header>

<section class="about">

    <!-- INFO LINKS -->

    <div class="info">

        <h1>Marco Sahli</h1>

        <h2>Filmmaker / Creative Producer</h2>

        <div class="contact">
            Florastrasse 18<br>
            8008 Zürich<br><br>

            info@customfilms.ch<br>

            +41 76 342 23 07
        </div>

    </div>

    <!-- VIDEO RECHTS -->

    <iframe
        src="https://player.vimeo.com/video/1198727288?background=1&autoplay=1&loop=1&muted=1"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

</section>

<footer>
    © Custom Films
</footer>

</body>
</html>
